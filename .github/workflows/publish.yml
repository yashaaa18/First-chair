# Publishes the game to Roblox with Open Cloud — no Studio needed.
#
# Setup (see docs/PUBLISHING_FROM_IPAD.md):
#   * The experience's IDs are plain configuration below (they are public: they appear
#     in Creator Hub URLs). Change them here if you ever publish to a different experience.
#   * The API key is the only secret. Repo Settings -> Secrets and variables -> Actions:
#       ROBLOX_API_KEY   Open Cloud API key with "universe-places: write" for this experience
#
# Then: Actions tab -> "Publish to Roblox" -> Run workflow.

name: Publish to Roblox

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Published = live for players. Saved = upload without going live."
        type: choice
        options: [Published, Saved]
        default: Published

env:
  UNIVERSE_ID: "10771328364"
  PLACE_ID: "125527667705419"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: scripts/install-tools.sh .tools

      - name: Check, test, build, bake and simulate
        run: scripts/build.sh

      - name: Upload to Roblox (Open Cloud Place Publishing API)
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          VERSION_TYPE: ${{ inputs.version_type }}
        run: |
          set -euo pipefail
          if [ -z "${ROBLOX_API_KEY}" ]; then
            echo "::error::Missing secret ROBLOX_API_KEY. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Publishing to universe ${UNIVERSE_ID}, place ${PLACE_ID} (${VERSION_TYPE})"
          status=$(curl -sS -o response.json -w "%{http_code}" -X POST \
            "https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=${VERSION_TYPE}" \
            -H "x-api-key: ${ROBLOX_API_KEY}" \
            -H "Content-Type: application/xml" \
            --data-binary @build/FirstChair.rbxlx)
          echo "Roblox responded with HTTP ${status}"
          cat response.json; echo
          if [ "${status}" != "200" ]; then
            echo "::error::Publish failed (HTTP ${status}). See docs/PUBLISHING_FROM_IPAD.md -> Troubleshooting."
            exit 1
          fi
          echo "Published! New place version: $(cat response.json)"
