name: Build & Test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools (Rojo, Lune, Luau, StyLua)
        run: scripts/install-tools.sh .tools

      - name: Check, test, build, bake and simulate
        run: scripts/build.sh

      - name: Upload place file
        uses: actions/upload-artifact@v4
        with:
          name: FirstChair-place
          path: build/FirstChair.rbxlx
